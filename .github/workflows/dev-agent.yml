name: Agent développeur

on:
  workflow_dispatch:        # lancement manuel (bouton "Run workflow")
  # schedule:               # lancement automatique, à activer plus tard
  #   - cron: "*/15 8-19 * * 1-5"

concurrency:
  group: dev-agent          # jamais deux agents en même temps
  cancel-in-progress: false

jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Vérifier les secrets
        run: |
          for v in GH_PAT TRELLO_KEY TRELLO_TOKEN CLAUDE_CODE_OAUTH_TOKEN; do
            if [ -n "${!v}" ]; then echo "$v : présent"; else echo "$v : ABSENT"; fi
          done
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}   # pour que la PR déclenche les autres workflows
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Claude Code et les dépendances
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install requests

      - name: Identité git de l'agent
        run: |
          git config user.name "agent-dev"
          git config user.email "agent-dev@users.noreply.github.com"

      - name: Lancer l'agent
        run: python agent/dev_agent.py
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          LIST_AGENT: ${{ vars.LIST_AGENT }}
          LIST_EN_COURS: ${{ vars.LIST_EN_COURS }}
          LIST_REVUE: ${{ vars.LIST_REVUE }}
          LIST_HUMAIN: ${{ vars.LIST_HUMAIN }}